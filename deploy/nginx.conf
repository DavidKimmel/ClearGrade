# ClearGrade Nginx configuration
# To add SSL: sudo certbot --nginx -d cleargrade.co -d www.cleargrade.co

server {
    listen 80;
    server_name cleargrade.co www.cleargrade.co;

    # --- Gzip compression ---------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 256;

    # --- Static front-end files ---------------------------------------------
    location / {
        root /var/www/cleargrade/public;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # --- Flask API proxy ----------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Generated audit dashboards -----------------------------------------
    # disable_symlinks off: allow the "latest" symlink inside each business dir
    location /audits/ {
        alias /var/www/cleargrade/audits/;
        autoindex off;
        disable_symlinks off;
    }
}
