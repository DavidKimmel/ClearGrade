<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video A/B</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0f1a; color: #f0f2f5; font-family: sans-serif; }
    .controls {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      background: rgba(10,15,26,0.9); backdrop-filter: blur(12px);
      padding: 16px 24px; display: flex; gap: 16px; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    button {
      padding: 8px 20px; border-radius: 8px; border: 1px solid #38bdf8;
      background: transparent; color: #38bdf8; font-size: 14px; font-weight: 600;
      cursor: pointer;
    }
    button.active { background: #38bdf8; color: #0a0f1a; }
    #info { margin-left: auto; font-size: 13px; color: #8b95a8; }
    .wrap { width: 100vw; height: 100vh; position: relative; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 65% center; }
    .overlay {
      position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(90deg, rgba(10,15,26,0.92) 0%, rgba(10,15,26,0.7) 40%, rgba(10,15,26,0.2) 70%, transparent 100%);
    }
    h1 {
      position: absolute; z-index: 2; top: 50%; left: 40px; transform: translateY(-50%);
      font-family: 'DM Sans', sans-serif; font-size: 48px; font-weight: 700; max-width: 500px; line-height: 1.1;
    }
    h1 em { font-family: 'Instrument Serif', serif; color: #38bdf8; font-weight: 400; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="controls">
    <button class="active" onclick="show(5, this)">Video 5 (10s, subtle)</button>
    <button onclick="show(6, this)">Video 6 (8s, high-quality, 0.5x)</button>
    <span id="info">Click to compare</span>
  </div>
  <div class="wrap">
    <video id="vid" autoplay muted loop playsinline src="assets/hero-video-5.mp4"></video>
    <div class="overlay"></div>
    <h1>Find out what's working, what's broken, and <em>what to fix first.</em></h1>
  </div>
  <script>
    function show(n, btn) {
      document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      var vid = document.getElementById('vid');
      vid.src = 'assets/hero-video-' + n + '.mp4';
      vid.playbackRate = n === 6 ? 0.5 : 1.0;
      vid.load();
      vid.play();
      document.getElementById('info').textContent = n === 6 ? 'Playing at 0.5x speed' : 'Playing at normal speed';
    }
  </script>
</body>
</html>
