<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearGrade — 3D Model Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0f1a; color: #f0f2f5; font-family: sans-serif; }
    .controls {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      background: rgba(10,15,26,0.9); backdrop-filter: blur(12px);
      padding: 16px 24px; display: flex; gap: 16px; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .controls button {
      padding: 8px 20px; border-radius: 8px; border: 1px solid #38bdf8;
      background: transparent; color: #38bdf8; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .controls button.active { background: #38bdf8; color: #0a0f1a; }
    .controls button:hover:not(.active) { background: rgba(56,189,248,0.15); }
    #info { margin-left: auto; font-size: 13px; color: #8b95a8; }
    #canvas-container { width: 100vw; height: 100vh; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div class="controls">
    <button class="active" onclick="loadModel('assets/hero-model-1.fbx', this)">Model 1</button>
    <button onclick="loadModel('assets/hero-model-2.fbx', this)">Model 2</button>
    <span id="info">Loading Three.js...</span>
  </div>
  <div id="canvas-container"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const container = document.getElementById('canvas-container');
    const info = document.getElementById('info');

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0f1a);

    // Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 4);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.5;

    // Lighting — cinematic like the Dribbble inspirations
    const ambientLight = new THREE.AmbientLight(0x111827, 0.3);
    scene.add(ambientLight);

    // Key light — cool cyan from upper left
    const keyLight = new THREE.DirectionalLight(0x38bdf8, 1.5);
    keyLight.position.set(-3, 4, 2);
    scene.add(keyLight);

    // Fill — warm amber from below
    const fillLight = new THREE.PointLight(0xfbbf24, 0.8, 10);
    fillLight.position.set(0, -2, 1);
    scene.add(fillLight);

    // Rim light — cool white from behind
    const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
    rimLight.position.set(2, 2, -3);
    scene.add(rimLight);

    // Subtle ground plane reflection
    const groundGeo = new THREE.PlaneGeometry(20, 20);
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x0a0f1a,
      metalness: 0.9,
      roughness: 0.4,
      transparent: true,
      opacity: 0.5
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.5;
    scene.add(ground);

    // FBX Loader
    const loader = new FBXLoader();
    let currentModel = null;
    let mixer = null;
    const clock = new THREE.Clock();

    window.loadModel = function(path, btn) {
      // Update active button
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      info.textContent = 'Loading model...';

      // Remove current model
      if (currentModel) {
        scene.remove(currentModel);
        currentModel = null;
        mixer = null;
      }

      loader.load(path, function(object) {
        // Auto-scale to fit
        const box = new THREE.Box3().setFromObject(object);
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 2.5 / maxDim;
        object.scale.setScalar(scale);

        // Center
        const center = box.getCenter(new THREE.Vector3());
        object.position.sub(center.multiplyScalar(scale));

        // Setup animation mixer if animations exist
        if (object.animations && object.animations.length > 0) {
          mixer = new THREE.AnimationMixer(object);
          object.animations.forEach(function(clip) {
            mixer.clipAction(clip).play();
          });
          info.textContent = 'Loaded — ' + object.animations.length + ' animation(s) playing. Drag to orbit.';
        } else {
          info.textContent = 'Loaded — no animations. Drag to orbit.';
        }

        currentModel = object;
        scene.add(object);
      },
      function(xhr) {
        if (xhr.total) {
          info.textContent = 'Loading... ' + Math.round(xhr.loaded / xhr.total * 100) + '%';
        }
      },
      function(error) {
        info.textContent = 'Error loading model: ' + error.message;
        console.error(error);
      });
    };

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Resize
    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Load first model
    loadModel('assets/hero-model-1.fbx', null);
  </script>
</body>
</html>
